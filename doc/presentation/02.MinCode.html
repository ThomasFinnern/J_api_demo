## Service provider 'services/provider.php'

Here the 'secondhand' API definition class is instantiated <br>and listed as a service provider.

```php [14-15]
use Joomla\...

use Bluebox\Plugin\WebServices\Secondhand\Extension\Secondhand;

return new class () implements ServiceProviderInterface{
    /* Registers the service provider with a DI container.
     * @param   Container  $container  The DI container.
     * @return  void */
    public function register(Container $container): void
    {
        $container->set(
            PluginInterface::class,
            $container->lazy(Secondhand::class, function (Container $container){
                $plugin = new Secondhand(
                    (array) PluginHelper::getPlugin('webservices', 'secondhand')
                );
                $plugin->setApplication(Factory::getApplication());

                return $plugin;
            })
        );
    }
};
```
			</textarea>
        </section>

## Route extension class 'src\Extension\Secondhand.php'

### part two

**function onBeforeApiRoute**

```php [3|5-6,13|8-12]
public function onBeforeApiRoute(BeforeApiRouteEvent $event): void
{
    $router = $event->getRouter();

    $defaults = ['component' => 'com_secondhand'];
    $getDefaults = array_merge(['public' => false], $defaults);

    $router->createCRUDRoutes(
        'v1/secondhand/books',
        'books',
        $getDefaults
    );
}
```

**createCRUDRoutes:** Here the magic happens.

			</textarea>

        <section data-markdown>
            <textarea data-template>

## createCRUDRoutes
### Internal routes created

<img src="./assets/images/mermaid/ResultUrlRequest_1.png" />

function createCRUDRoutes has defined all CRUD routes internally


                 </textarea>
        </section>

        <section data-markdown>
			<textarea data-template>
### The magic applied

instead of
```php
    $router->createCRUDRoutes(
        'v1/secondhand/books',
        'books',
        $getDefaults
    );
```
We could have written:
```php
   $routes = [
        new Route(['GET'],    'v1/secondhand/books',     'books.displayList', [],                $defaults),
        new Route(['GET'],    'v1/secondhand/books/:id', 'books.displayItem', ['id' => '(\d+)'], $defaults),
        new Route(['POST'],   'v1/secondhand/books',     'books.add',         [],                $defaults),
        new Route(['PATCH'],  'v1/secondhand/books/:id', 'books.edit',        ['id' => '(\d+)'], $defaults),
        new Route(['DELETE'], 'v1/secondhand/books/:id', 'books.delete',      ['id' => '(\d+)'], $defaults),
   ];

   $this->addRoutes($routes);
```

Which tells us `new Route(...)` will be the syntax for all our defined API routes
			</textarea>
        </section>

        <section data-markdown>
			<textarea data-template>
## General Route function parameters

```php[1,3]
     new Route('CRUD' command, endpoint, 'controller'.'function', [var.regex], defaults);

    $router->createCRUDRoutes('base endpoint', 'controller', defaults);
```

| &nbsp; | &nbsp; example                 | &nbsp;description                              |
|:--------|:--------------------------------|:-------------------------------------------|
| 'CRUD' command     | &nbsp;GET,POST,PATCH,DELETE  | &nbsp;       |
| endpoint     | &nbsp;`v1/secondhand/books`     | &nbsp; route path       |
| &nbsp;     | &nbsp;`v1/secondhand/books/:id`     | &nbsp; route path with variable      |
| controller     | &nbsp;`books`     | &nbsp; path to controller and view      |
| function     | &nbsp;`displayItem`     | &nbsp; any function in defined controller can be called  |
| var.regex     | &nbsp;`['id' => '(\d+)']`    | &nbsp; Regex to catch and secure the variable value |
| defaults     | &nbsp;`['component' => 'com_secondhand',`     | &nbsp; array of 'configuration' variables       |
| defaults     | &nbsp;`'public' => false]`     | &nbsp;  more see next page       |



			</textarea>
        </section>

        <section data-markdown>
			<textarea data-template>

## X-Token and $getDefaults

The route needs to know the component name

```php
    $defaults = ['component' => 'com_secondhand'];
```

**Joomla X-Token**<br>
The X-Token is the key to the API door and is expected to <br>
be part of the curl/http data send. The X-Token can be <br>
fetched in user admin account after save.

With defaults flag "`'public' => true`" on local development systems we <br>
enable API calls without X-Token.

```php [2|3]
    // ToDo: Remove when tests finished, enables access without token
    $getDefaults = array_merge(['public' => true], $defaults);
    $getDefaults = array_merge(['public' => false], $defaults);
```

 Please make sure to remove this before going online

Above $getDefaults is passed  as last parameter to the route <br>function definition

* We have to insert section API into manifest

<br>

### The API sub folder structure:

From the root of the joomla web page
``` [1|4|7]
api\components\com_secondhand\
├─── src
     ├─── Controller
     │    └─── BooksController.php
     └─── View
          └─── Books
               └─── JsonapiView.php
```
Attention: The API folder structure is similar to other component<br>
structures with the exception that the controller folder keeps all<br>
`nnnController.php` files without further subdirectories.<br>
The view code is always kept in a JsonapiView.php file in a named folder

## Controller in API part 'BooksController.php'

```php [5,8,11]
namespace Bluebox\Component\Secondhand\Api\Controller;

...

class BooksController extends ApiController
{
    // The content type of the item.
    protected $contentType = 'books';

    // The default view for the display method.
    protected $default_view = 'books';

    // Implement other methods like read, update, delete as needed
    ...
}
```

Within the minimal controller only two variables need to be defined, <br>
as the controller class inherits from ApiController.
* The `$contentType` tells which component model to use
* The `$default_view` tells which view does render the collected data.

## API route definitions created

The CRUD definitions result in following API routes:

| Command | &nbsp;endpoint                  | &nbsp;Comment                              |
|:--------|:--------------------------------|:-------------------------------------------|
| GET     | &nbsp;`v1/secondhand/books`     | &nbsp;lists all books with variables       |
| GET     | &nbsp;`v1/secondhand/books/:id` | &nbsp;lists variables of book              |
| POST    | &nbsp;`v1/secondhand/books`     | &nbsp;creates new book with data           |
| PATCH   | &nbsp;`v1/secondhand/books/:id` | &nbsp;writes parameters into selected book |
| DELETE  | &nbsp;`v1/secondhand/books/:id` | &nbsp;deletes selected book                |

Attention: There is no PUT support in Joomla
			</textarea>
        </section>

## GET v1/secondhand/books (lists all books with variables)</h2>

**Response:**

| http code | content-type                      | response                                                                                                            |

**Example CURL:**

```batch
curl -s --show-error
  -X GET "http://127.0.0.1/web_page/api/index.php/v1/secondhand/books"
  -H "Content-Type: application/json" -H "X-Joomla-Token:  ..."
```

## POST v1/secondhand/books (part 1)

**Parameters:**

| name                | type    | data type    | description |
