# Extend J! API support with own code
![logo10](./assets/icons/left_right.start.svg)

If your request does not involve a standard table, <br>
you must bypass the default behavior of the J! API function.
* Patch results by overriding base function but calling parent
* Handle parts/all on your own

Some important examples are listed below. <br>

Of course all functions in the Joomla library API files<br>
**ApiController.php, ApiMVCFactory.php, JsonApiView.php** can be overridden.<br>
For 'API' models the standard MVC models are applied. There is no special <br>
Apimodel.php file for API.

			</textarea>
        </section>

        <section data-markdown>
			<textarea data-template>

## Functions to override

There are some empty parent functions provided <br>
to be overwritten from derived classes

### Function prepareItem (jsonApi.php)

Example: The 'get' command to the component config variables has <br>no **id** but
the standard view function does expect an id. <br>
Solution: In component JsonApiView.php override function prepareItem($item)

```php
/**
 * Prepare item before render.
 * @param   object  $item  The model item
 * @return  object
 */
protected function prepareItem($item)
{
    // Config resources have no id.
    $item->id = '0';

    return $item;
}
```
			</textarea>
        </section>

        <section data-markdown>
			<textarea data-template>

### Function preprocessSaveData (...controller.php)

Controller:  protected function preprocessSaveData(array $data): array

```php
/**
 * Method to allow extended classes to manipulate the data to be saved for an extension.
 * @param   array  $data  An array of input data.
 * @return  array
 */
protected function preprocessSaveData(array $data): array
{
    foreach (FieldsHelper::getFields('com_contact.contact') as $field) {
        if (isset($data[$field->name])) {
            !isset($data['com_fields']) && $data['com_fields'] = [];

            $data['com_fields'][$field->name] = $data[$field->name];
            unset($data[$field->name]);
        }
    }

    if ($this->input->getMethod() === 'PATCH') {
        $data['rules'] = json_decode($data['rules'], true);
    }

    $data['client_id'] = $this->getClientIdFromInput();

    return $data;
}
```

This function is mainly used to handle fields, <br>
apply special variables handling on patch/post commands <br>
or patch data before save function is called

### Expand by defining own Api module.php

Example route/code for retrieving the component version ID via the API.
Besides defining the route, a bare controller only a module and
a helper is added.

Also the code to change the version is presentetd here

    new Route(['GET'],   'v1/secondhand/version', 'version.displayItem', [], $getDefaults),

### New File VersionModel.php

! No additional code in controller for get. <br>
The module supports getItem which is called by joomla API code

```php
public function getItem()
{
    $oManifest = ManifestHelper::getDbManifest($this->componentName);

    $oVersion->version      = $oManifest['version'];
    $oVersion->creationDate = $oManifest['creationDate'];

    return $oVersion;
}
```

The ManifestHelper.php reads/writes the versionId from/to the database.<br>

Change in jsonApiView.php with additional function prepareItem ()

```php
class JsonapiView extends BaseApiView
{
    protected $fieldsToRenderItem = [
        'version',
        'creationDate',
    ];

    protected function prepareItem($item)
    {
        // version resources have no id.
        $item->id = '0';

        return $item;
    }
}
```

That is all that is required to create a 'getVersion' API code.

### Code to write the versionID

In Version controller the edit function interfaces directly with the parallel model

The view (displayItem) is called afterwards with id=0
as it expects an table id
<br>
<br>

VersionController.php
```php
public function edit() : ApiController
{
    // Access check.
    if (!$this->allowEdit())
    {
        throw new NotAllowed('JLIB_APPLICATION_ERROR_CREATE_RECORD_NOT_PERMITTED', 403);
    }

    // all variables
    $data = $this->input->json->getArray();

    if (empty($data))
    {
        throw new InvalidParameterException(Text::_('No parameter given for patch config'), 403);
    }

    //--- Create the model -----------------------------------------------------------------

    /** @var VersionModel $model */
    $model = $this->getModel('Version', '', ['ignore_request' => true, 'state' => $this->modelState]);

    $isSaved = $model->save($data);

    return parent::displayItem('0');
}
```

			</textarea>
        </section>

        <section data-markdown>
			<textarea data-template>
### Save code in VersionModel.php

```php
public function save(mixed $data = []) {
    $isSaved = true;
    if (!empty ($data)) {
        $isChanged = false;
        $isSaved = false;

        try {
            $oManifest = ManifestHelper::getDbManifest($this->componentName);
            if (!empty($oManifest)) {
                if (!empty ($data['version'])) {
                    $version = $data['version'];
                    if ($oManifest['version'] != $version)
                    {
                        $oManifest['version'] = $data['version'];
                        $isChanged = true;
                    }
                }

                if (!empty ($data['creationDate'])) {
                    $creationDate = $data['creationDate'];
                    if ($oManifest['creationDate'] != $creationDate) {
                        $oManifest['creationDate'] = $creationDate;
                        $isChanged = true;
                    }
                }

                if ($isChanged) {
                    $isSaved = ManifestHelper::saveDbManifest($oManifest, $this->componentName);
                }
            }
        } catch (\Exception $e) { throw new \RuntimeException($e->getMessage()); }
    }

    return $isSaved;
}
```

The ManifestHelper.php reads/writes the versionId from/to the database.<br>

# Summary for the requests without the corresponding table:

## Get item/items:
* Tell controller the name of content type and view
* Overwrite GetItem/GetItems in module

<br>

## post/patch item/items:
* Overwrite edit in controller
* Create save function in module and call it in edit function
<br>
<br>

There may be similar aproaches working. But this is the gist of it.

## How to manipulate the state

The state parameter will be handled in the controller.

```php
$this->modelState->set('data', $data);
```

Seen in standard controller functions `displayitems`, `displayList`, `delete` ...

Following example (my own creation) assigns 'para' from input <br>and data from the request json to the state<br>
<br>
$param: param in url<br>
$data:  data by json object<br>

```php
public function displayItem($param = '')
{
    //--- set state from given parameter  -------------------------------------

    $param = $this->input->get('para', '', 'string');
    $this->modelState->set('param', $param);

    // all variables
    $data = $this->input->json->getArray();
    if (!empty($data))
    {
        $this->modelState->set('data', $data);
    }

    //--- display parameters --------------------------------------------------

    return parent::displayItem(0);
}
```

			</textarea>
        </section>

## modelState collection

Examples of modelState use coleccted in joomla component API projects
```php
public function displayList()
{
    $this->modelState->set('type_alias', $this->getTypeAliasFromInput());
    $this->modelState->set('type_id',    $this->getTypeIdFromInput());
    $this->modelState->set('item_id',    $this->getTypeAliasFromInput() . '.' . $this->getItemIdFromInput());

    $this->modelState->set('list.ordering',  'h.save_date');
    $this->modelState->set('list.direction', 'DESC');

    $this->modelState->set('filter.core',   ($requestBool === 'true') ? '1' : '0');
    $this->modelState->set('filter.status', $this->input->get('status', $this->input->get->get('status', null, 'INT'), 'INT'));
    $this->modelState->set('filter.type',   $this->input->get('type', $this->input->get->get('type', null, 'STRING'), 'STRING'));

    $this->modelState->set('filter.author_id',   $filter->clean($apiFilterInfo['author'], 'INT'));
    $this->modelState->set('filter.category_id', $filter->clean($apiFilterInfo['category'], 'INT'));
    $this->modelState->set('filter.search',      $filter->clean($apiFilterInfo['search'], 'STRING'));
    $this->modelState->set('filter.published',   $filter->clean($apiFilterInfo['state'], 'INT'));
    $this->modelState->set('filter.featured',    $filter->clean($apiFilterInfo['featured'], 'INT'));

    return parent::displayList();
}
